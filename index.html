var DICT={"en":{"Pruebas de pantalla":"Screen Tests","Patrones de prueba para revisar color, uniformidad, ghosting y nitidez en móviles, escritorio y televisores.":"Test patterns to check color, uniformity, ghosting and sharpness on phones, desktops and TVs.","Filtrar por categoría":"Filter by category","Las pruebas de movimiento y de cambio de color pueden afectar a personas fotosensibles. Usa velocidades moderadas y detente si sientes molestias.":"Motion and color-change tests can affect photosensitive people. Use moderate speeds and stop if you feel discomfort.","Prueba a pantalla completa":"Full-screen test","Cerrar":"Close","Prueba anterior":"Previous test","‹ Anterior":"‹ Previous","Prueba siguiente":"Next test","Siguiente ›":"Next ›","Idioma":"Language","Tema":"Theme","Automático":"Automatic","Claro":"Light","Oscuro":"Dark","oscuro":"dark","claro":"light","sistema":"system","Todas":"All","Color":"Color","Uniformidad":"Uniformity","Píxeles":"Pixels","Movimiento":"Motion","Nitidez":"Sharpness","Táctil":"Touch","SMPTE barras":"SMPTE bars","Escala de grises":"Grayscale ramp","Contraste":"Contrast","Uniformidad gris":"Gray uniformity","Uniformidad RGB y CMYK":"RGB and CMYK uniformity","Desatascador de píxeles":"Pixel unsticker","Atenuación local":"Local dimming","Ghosting":"Ghosting","Geometría":"Geometry","Geometría y calibración":"Geometry and calibration","Negros bajos":"Low blacks","Líneas finas":"Fine lines","Nivel":"Level","Velocidad":"Speed","Tamaño":"Size","Densidad":"Density","Pasada":"Pass","Diagonal":"Diagonal","cada":"every","rápido":"fast","estrellas":"stars","pulg":"in","no indicada":"not set","Limpiar":"Clear","Negro":"Black","Gris":"Gray","Blanco":"White","Rojo":"Red","Verde":"Green","Azul":"Blue","Cian":"Cyan","Magenta":"Magenta","Amarillo":"Yellow","Negro (K)":"Black (K)","Iniciar":"Start","Pausar":"Pause","ajustable":"adjustable","Abrir":"Open","ppp":"ppi","indica la diagonal para ver ppp":"enter the diagonal to see ppi","Resolución":"Resolution","Escala":"Scale","visor":"viewer","ventana":"window","CSS":"CSS","máximo":"max","Espacio":"Space","Atrás":"Back","cierra":"close","controles":"controls","pausa":"pause","acepta":"accept","cambian de prueba":"change test","muestra u oculta el panel":"show or hide the panel","Clic en la pantalla muestra u oculta el panel":"Click the screen to show or hide the panel","Desliza ← → para cambiar de prueba":"Swipe ← → to change test","Desliza hacia abajo para cerrar":"Swipe down to close","Guía rápida.":"Quick guide.","Revisa color, brillo y niveles de negro con barras estándar.":"Checks color, brightness and black levels with standard bars.","Bloques de 5 % a 95 %. El nivel elegido se muestra grande sobre negro y sobre blanco; el marco amarillo lo señala.":"Blocks from 5 % to 95 %. The chosen level is shown large on black and on white; the yellow frame marks it.","Un solo gris de 0 a 100 %, con atajos para negro y blanco. El negro muestra fuga de luz y nubosidad; el blanco, manchas y viñeteo; los grises medios, bandas.":"A single gray from 0 to 100 %, with shortcuts for black and white. Black shows light leakage and clouding; white shows spots and vignetting; mid grays show banding.","Un color a pantalla completa a la vez: rojo, verde, azul, cian, magenta, amarillo, blanco y negro (K). Cambia a mano, sin parpadeo automático. También sirve para buscar píxeles muertos: busca puntos que no coincidan con el color.":"One full-screen color at a time: red, green, blue, cyan, magenta, yellow, white and black (K). Change it by hand, no automatic flicker. Also useful for finding dead pixels: look for spots that don't match the color.","Cuadrícula de cuadros que cambian de color al azar entre rojo, verde, azul, cian, magenta, amarillo, blanco y negro. Cada cuadro cambia por su cuenta, en un momento distinto y sin seguir una secuencia. Empieza en pausa. No siempre libera un píxel atascado.":"Grid of squares that change color at random among red, green, blue, cyan, magenta, yellow, white and black. Each square changes on its own, at a different time and without a sequence. Starts paused. It doesn't always free a stuck pixel.","Cambia de color de forma repetida, y más rápido en las velocidades altas. Evítalo si eres fotosensible.":"Changes color repeatedly, faster at high speeds. Avoid it if you are photosensitive.","Estrellas de distintos tamaños que se desplazan despacio sobre negro. Si alrededor de las más brillantes aparece un halo, o si se apagan al cruzar, la pantalla usa atenuación local (local dimming). Cambia la densidad: con pocas estrellas el halo se ve mejor, y con muchas la prueba exige más a la retroiluminación.":"Stars of different sizes drift slowly over black. If a halo appears around the brightest ones, or they dim as they cross areas, the screen uses local dimming. Change the density: with few stars the halo is easier to see, and with many the test puts more demand on the backlight.","Barras de 0 a 8 % de luminancia sobre negro. Lo ideal es distinguir las barras de 2 % y 4 % del fondo, y que la de 0 % se funda con él. Si todas se ven iguales, el televisor aplasta las sombras; si la de 0 % se ve gris, el negro está levantado. Haz la prueba en cuarto oscuro.":"Bars from 0 to 8 % luminance on black. Ideally you can tell the 2 % and 4 % bars from the background, and the 0 % bar blends into it. If they all look the same, the TV crushes shadows; if the 0 % bar looks gray, black is raised. Run the test in a dark room.","Líneas blancas y negras de un píxel real: verticales en la mitad superior y horizontales en la inferior. Deberías distinguir cada línea. Si se ven grises, borrosas o con patrones de interferencia (moiré), la pantalla escala la imagen.":"White and black lines one real pixel wide: vertical in the top half and horizontal in the bottom half. You should distinguish every line. If they look gray, blurred or show interference patterns (moiré), the screen is scaling the image.","Toca una miniatura para abrirla a pantalla completa. Fija el brillo de tu pantalla antes de empezar. Usa Uniformidad para ver manchas y fuga de luz, y para buscar puntos apagados o fijos con un color a la vez. Usa Píxeles para intentar liberar un píxel atascado, y Atenuación local para detectar halos de la retroiluminación. En Ghosting, observa si el bloque deja estela. En Geometría y calibración, revisa el recuadro central y la resolución, densidad y escala de tu pantalla.":"Tap a thumbnail to open it full screen. Set your screen brightness before you start. Use Uniformity to see spots and light leakage, and to find dark or stuck dots one color at a time. Use Pixels to try to free a stuck pixel, and Local dimming to spot backlight halos. In Ghosting, check whether the block leaves a trail. In Geometry and calibration, check the central box and this screen's resolution, density and scale.","Hay movimiento. Puede afectar a personas fotosensibles; usa velocidades moderadas.":"Contains motion. It can affect photosensitive people; use moderate speeds.","Pico de brillo":"Peak brightness","Contador de toques":"Touch counter","Cuadrícula de deslizamiento":"Swipe grid","Ventana":"Window","SDR":"SDR","HDR":"HDR","HDR no disponible en este navegador o pantalla":"HDR not available in this browser or display","Toques a la vez":"Touches at once","Cuadros":"Squares","cubierto":"covered","Cada dedo o clic deja un círculo de color que se mantiene al soltar. Al volver a tocar la pantalla, los círculos se borran. El contador muestra cuántos puntos se tocan a la vez y el máximo.":"Each finger or click leaves a colored circle that stays after release. Touching the screen again clears the circles. The counter shows how many points touch at once and the maximum.","Desliza el dedo o el ratón por la pantalla: cada cuadro que cruzas se pinta. Sirve para comprobar que todas las zonas detectan el toque. Ajusta la cantidad de cuadros o limpia para empezar de nuevo.":"Swipe a finger or the mouse across the screen: every square you cross is painted. Use it to check that every area detects touch. Adjust the number of squares or clear to start again.","Negro puro":"Pure black","Smearing (VA)":"Smearing (VA)","Fondo":"Background","Gris oscuro":"Dark gray","Gris medio":"Mid gray","Usar negro puro en modo oscuro":"Use pure black in dark mode","Tamaño de estrellas":"Star size","Nitidez de texto":"Text sharpness","Texto en movimiento":"Moving text","Grises":"Grays","Cómo activar HDR":"How to enable HDR","Una ventana blanca sobre negro, con tamaño de 10 a 100 % del área de la pantalla. Un área pequeña mide el pico de brillo; un área grande mide el brillo sostenido. Elige SDR o HDR. HDR requiere un navegador y una pantalla compatibles; mira Cómo activar HDR.":"A white window on black, sized from 10 to 100 % of the screen area. A small area measures peak brightness; a large area measures sustained brightness. Choose SDR or HDR. HDR requires a compatible browser and display; see How to enable HDR.","HDR todavía no es compatible con todos los navegadores: el soporte en CSS depende del navegador, su versión y su motor. Esta prueba no se ha verificado en navegadores reales con HDR.":"HDR is not yet supported by all browsers: CSS support depends on the browser, its version and its engine. This test has not been verified in real HDR browsers.","Activa HDR en el sistema: en Windows, Configuración › Sistema › Pantalla › Usar HDR (o Win + Alt + B). En macOS, Android y Linux, busca la opción de HDR en los ajustes de pantalla.":"Turn on HDR in the system: on Windows, Settings › System › Display › Use HDR (or Win + Alt + B). On macOS, Android and Linux, look for the HDR option in the display settings.","Chrome: si la prueba sigue en SDR, abre chrome://flags/#force-color-profile, elige HDR10 o scRGB linear y reinicia el navegador.":"Chrome: if the test still shows SDR, open chrome://flags/#force-color-profile, choose HDR10 or scRGB linear and restart the browser.","Edge (basado en Chromium): busca la misma opción de perfil de color en edge://flags.":"Edge (Chromium-based): look for the same color profile option in edge://flags.","Firefox: usa la versión 153 o posterior y comprueba si la prueba cambia; el soporte es reciente.":"Firefox: use version 153 or later and check whether the test changes; support is recent.","Safari (macOS): usa una pantalla compatible con HDR y comprueba la prueba; no hemos podido verificarlo.":"Safari (macOS): use an HDR-capable display and check the test; we could not confirm this.","Si la prueba sigue en SDR aunque lo hayas activado, el navegador no soporta HDR en CSS. Para comparar, abre testufo.com/hdr.":"If the test still shows SDR with HDR turned on, the browser does not support HDR in CSS. To compare, open testufo.com/hdr.","Calibración":"Calibration","Convergencia":"Convergence","Cuadros cuadrados":"Square tiles","Cuadrícula":"Grid","Tablero de cuadros que deben verse cuadrados. Si salen rectangulares, la imagen está escalada de forma desigual en horizontal y vertical.":"Checkerboard of squares that should look square. If they come out rectangular, the image is scaled unevenly horizontally and vertically.","Relación de aspecto":"Aspect ratio","Dirección":"Direction","Escala de grises y seis escalas de diez pasos, una por color. Usa la opción Escala para verlas todas o una sola.":"Grayscale and six ten-step scales, one per color. Use the Scale option to see them all or just one.","Escalas de color y grises":"Color and grayscale scales","Ghosting y smearing":"Ghosting and smearing","Ghosting: un bloque cruza la pantalla sobre fondos claro y oscuro; si deja estela, la respuesta es lenta (más segundos por pasada, más lento). Smearing (VA): una barra blanca se mueve sobre un fondo oscuro; en paneles VA deja una estela oscura o clara. Usa Pausar para revisar un solo cuadro.":"Ghosting: a block crosses the screen over light and dark backgrounds; if it leaves a trail, the response is slow (more seconds per pass, slower). Smearing (VA): a white bar moves over a dark background; on VA panels it leaves a dark or light trail. Use Pause to check a single frame.","Horizontal":"Horizontal","Inicio automático de pruebas de movimiento":"Automatic start of motion tests","Modo":"Mode","Rango":"Range","Uniforme":"Uniform","Variado":"Varied","Vertical":"Vertical","activado":"enabled","desactivado":"disabled","Relación de aspecto y overscan":"Aspect ratio and overscan","Relación de aspecto: círculo y marcos de 4:3, 16:9, 21:9 y 32:9. Cada marco se ajusta al borde más cercano de la pantalla y lleva su nombre; si la imagen se estira, el círculo deja de ser redondo. Overscan: recuadros a 0, 2, 5 y 10 % de los bordes con una cruz central; si el televisor recorta la imagen, el recuadro de 0 % no se ve completo.":"Aspect ratio: circle and frames for 4:3, 16:9, 21:9 and 32:9. Each frame fits the nearest screen edge and shows its name; if the image is stretched, the circle is no longer round. Overscan: boxes at 0, 2, 5 and 10 % from the edges with a center cross; if the TV crops the image, the 0 % box is not fully visible.","Overscan":"Overscan","Rejillas roja, verde y azul superpuestas. Aplica a tubos CRT y a proyectores de tres paneles o chips (3LCD, DLP de 3 chips). En pantallas planas de un solo panel (LCD, OLED, Mini LED) la convergencia viene de fábrica y no se ajusta: la prueba solo muestra desalineación de color. Con buena convergencia las líneas y los puntos se ven blancos; si no converge, aparecen bordes o puntos de color.":"Red, green and blue grids overlaid. Applies to CRT tubes and three-panel or three-chip projectors (3LCD, 3-chip DLP). On flat single-panel screens (LCD, OLED, Mini LED) convergence is set at the factory and cannot be adjusted: the test only shows color misalignment. With good convergence, lines and dots look white; if not, colored edges or dots appear.","Doble toque en la pantalla para mostrar u ocultar el panel":"Double tap the screen to show or hide the panel","Alfabeto":"Alphabet","Latino":"Latin","Japonés":"Japanese","Coreano":"Korean","Chino":"Chinese","Ruso":"Russian","Árabe":"Arabic","Texto para revisar la nitidez en pantallas de píxel blanco (como W-OLED). Elige el alfabeto (latino, japonés, coreano, chino, ruso o árabe) y compara los bordes de las letras: si aparecen franjas de color, la pantalla usa otra distribución de subpíxeles o un filtro de nitidez. Las letras pequeñas son la mejor prueba.":"Text to check sharpness on white-pixel screens (such as W-OLED). Choose the alphabet (Latin, Japanese, Korean, Chinese, Russian or Arabic) and compare the letter edges: if colour fringes appear, the screen uses a different subpixel layout or a sharpening filter. Small letters are the best test.","Tres franjas de texto que se desplazan en direcciones opuestas. En horizontal: a la izquierda, texto vertical que sube; al centro, filas de texto horizontal que alternan izquierda y derecha; a la derecha, texto vertical que baja. En vertical, el mismo esquema girado. Tamaño uniforme o variado, y alfabeto a elegir. En paneles VA el texto en movimiento se emborrona o deja estela; compara la nitidez en pausa y en movimiento.":"Three bands of text moving in opposite directions. Horizontal: on the left, vertical text moving up; in the centre, rows of horizontal text alternating left and right; on the right, vertical text moving down. Vertical: the same layout rotated. Uniform or varied size, with a choice of alphabet. On VA panels moving text smears or leaves a trail; compare sharpness paused and in motion.","Cuadrícula o calibración. La calibración añade un recuadro central dentro del círculo con barras SMPTE, escala de grises, escala RGB y CMYK, y muestra la resolución, la densidad y la escala de esta pantalla. El navegador no conoce el tamaño físico: indica la diagonal para calcular los ppp. La escala incluye el zoom del navegador; para verla sin zoom, restablécelo al 100 % (Ctrl+0).":"Grid or calibration. Calibration adds a central box inside the circle with SMPTE bars, grayscale, RGB and CMYK scales, and shows this screen's resolution, density and scale. The browser does not know the physical size: enter the diagonal to calculate ppi. The scale includes the browser zoom; to see it without zoom, reset the zoom to 100% (Ctrl+0)."},"pt":{"Pruebas de pantalla":"Testes de tela","Patrones de prueba para revisar color, uniformidad, ghosting y nitidez en móviles, escritorio y televisores.":"Padrões de teste para verificar cor, uniformidade, ghosting e nitidez em celulares, computadores e TVs.","Filtrar por categoría":"Filtrar por categoria","Las pruebas de movimiento y de cambio de color pueden afectar a personas fotosensibles. Usa velocidades moderadas y detente si sientes molestias.":"Os testes de movimento e de mudança de cor podem afetar pessoas fotossensíveis. Use velocidades moderadas e pare se sentir desconforto.","Prueba a pantalla completa":"Teste em tela cheia","Cerrar":"Fechar","Prueba anterior":"Teste anterior","‹ Anterior":"‹ Anterior","Prueba siguiente":"Próximo teste","Siguiente ›":"Próximo ›","Idioma":"Idioma","Tema":"Tema","Automático":"Automático","Claro":"Claro","Oscuro":"Escuro","oscuro":"escuro","claro":"claro","sistema":"sistema","Todas":"Todas","Color":"Cor","Uniformidad":"Uniformidade","Píxeles":"Pixels","Movimiento":"Movimento","Nitidez":"Nitidez","Táctil":"Tátil","SMPTE barras":"Barras SMPTE","Escala de grises":"Escala de cinza","Contraste":"Contraste","Uniformidad gris":"Uniformidade cinza","Uniformidad RGB y CMYK":"Uniformidade RGB e CMYK","Desatascador de píxeles":"Desentupidor de pixels","Atenuación local":"Atenuação local","Ghosting":"Ghosting","Geometría":"Geometria","Geometría y calibración":"Geometria e calibração","Negros bajos":"Pretos baixos","Líneas finas":"Linhas finas","Nivel":"Nível","Velocidad":"Velocidade","Tamaño":"Tamanho","Densidad":"Densidade","Pasada":"Passagem","Diagonal":"Diagonal","cada":"a cada","rápido":"rápido","estrellas":"estrelas","pulg":"pol","no indicada":"não informada","Limpiar":"Limpar","Negro":"Preto","Gris":"Cinza","Blanco":"Branco","Rojo":"Vermelho","Verde":"Verde","Azul":"Azul","Cian":"Ciano","Magenta":"Magenta","Amarillo":"Amarelo","Negro (K)":"Preto (K)","Iniciar":"Iniciar","Pausar":"Pausar","ajustable":"ajustável","Abrir":"Abrir","ppp":"ppp","indica la diagonal para ver ppp":"informe a diagonal para ver os ppp","Resolución":"Resolução","Escala":"Escala","visor":"visor","ventana":"janela","CSS":"CSS","máximo":"máximo","Espacio":"Espaço","Atrás":"Voltar","cierra":"fecha","controles":"controles","pausa":"pausa","acepta":"confirma","cambian de prueba":"trocam de teste","muestra u oculta el panel":"mostra ou oculta o painel","Clic en la pantalla muestra u oculta el panel":"Clique na tela para mostrar ou ocultar o painel","Desliza ← → para cambiar de prueba":"Deslize ← → para trocar de teste","Desliza hacia abajo para cerrar":"Deslize para baixo para fechar","Guía rápida.":"Guia rápido.","Revisa color, brillo y niveles de negro con barras estándar.":"Verifique cor, brilho e níveis de preto com barras padrão.","Bloques de 5 % a 95 %. El nivel elegido se muestra grande sobre negro y sobre blanco; el marco amarillo lo señala.":"Blocos de 5 % a 95 %. O nível escolhido aparece grande sobre preto e sobre branco; a moldura amarela o marca.","Un solo gris de 0 a 100 %, con atajos para negro y blanco. El negro muestra fuga de luz y nubosidad; el blanco, manchas y viñeteo; los grises medios, bandas.":"Um único cinza de 0 a 100 %, com atalhos para preto e branco. O preto mostra vazamento de luz e nuvens; o branco, manchas e vinheta; os cinzas médios, faixas.","Un color a pantalla completa a la vez: rojo, verde, azul, cian, magenta, amarillo, blanco y negro (K). Cambia a mano, sin parpadeo automático. También sirve para buscar píxeles muertos: busca puntos que no coincidan con el color.":"Uma cor em tela cheia por vez: vermelho, verde, azul, ciano, magenta, amarelo, branco e preto (K). Troque manualmente, sem piscar automaticamente. Também serve para achar pixels mortos: procure pontos que não combinem com a cor.","Cuadrícula de cuadros que cambian de color al azar entre rojo, verde, azul, cian, magenta, amarillo, blanco y negro. Cada cuadro cambia por su cuenta, en un momento distinto y sin seguir una secuencia. Empieza en pausa. No siempre libera un píxel atascado.":"Grade de quadrados que mudam de cor ao acaso entre vermelho, verde, azul, ciano, magenta, amarelo, branco e preto. Cada quadrado muda por conta própria, em um momento diferente e sem seguir uma sequência. Começa pausado. Nem sempre libera um pixel preso.","Cambia de color de forma repetida, y más rápido en las velocidades altas. Evítalo si eres fotosensible.":"Muda de cor repetidamente, mais rápido nas velocidades altas. Evite se for fotossensível.","Estrellas de distintos tamaños que se desplazan despacio sobre negro. Si alrededor de las más brillantes aparece un halo, o si se apagan al cruzar, la pantalla usa atenuación local (local dimming). Cambia la densidad: con pocas estrellas el halo se ve mejor, y con muchas la prueba exige más a la retroiluminación.":"Estrelas de tamanhos diferentes que se deslocam devagar sobre preto. Se surgir um halo em volta das mais brilhantes, ou se elas apagarem ao cruzar áreas, a tela usa atenuação local (local dimming). Altere a densidade: com poucas estrelas o halo é mais fácil de ver, e com muitas o teste exige mais da retroiluminação.","Barras de 0 a 8 % de luminancia sobre negro. Lo ideal es distinguir las barras de 2 % y 4 % del fondo, y que la de 0 % se funda con él. Si todas se ven iguales, el televisor aplasta las sombras; si la de 0 % se ve gris, el negro está levantado. Haz la prueba en cuarto oscuro.":"Barras de 0 a 8 % de luminância sobre preto. O ideal é distinguir as barras de 2 % e 4 % do fundo, e que a de 0 % se funda com ele. Se todas parecem iguais, a TV esmaga as sombras; se a de 0 % parece cinza, o preto está elevado. Faça o teste em um quarto escuro.","Líneas blancas y negras de un píxel real: verticales en la mitad superior y horizontales en la inferior. Deberías distinguir cada línea. Si se ven grises, borrosas o con patrones de interferencia (moiré), la pantalla escala la imagen.":"Linhas brancas e pretas de um pixel real: verticais na metade superior e horizontais na inferior. Você deve distinguir cada linha. Se aparecerem cinzas, borradas ou com padrões de interferência (moiré), a tela está escalando a imagem.","Toca una miniatura para abrirla a pantalla completa. Fija el brillo de tu pantalla antes de empezar. Usa Uniformidad para ver manchas y fuga de luz, y para buscar puntos apagados o fijos con un color a la vez. Usa Píxeles para intentar liberar un píxel atascado, y Atenuación local para detectar halos de la retroiluminación. En Ghosting, observa si el bloque deja estela. En Geometría y calibración, revisa el recuadro central y la resolución, densidad y escala de tu pantalla.":"Toque em uma miniatura para abri-la em tela cheia. Ajuste o brilho da tela antes de começar. Use Uniformidade para ver manchas e vazamento de luz, e para achar pontos apagados ou fixos com uma cor por vez. Use Pixels para tentar liberar um pixel preso, e Atenuação local para detectar halos da retroiluminação. Em Ghosting, observe se o bloco deixa rastro. Em Geometria e calibração, confira a caixa central e a resolução, densidade e escala da sua tela.","Hay movimiento. Puede afectar a personas fotosensibles; usa velocidades moderadas.":"Há movimento. Pode afetar pessoas fotossensíveis; use velocidades moderadas.","Pico de brillo":"Brilho de pico","Contador de toques":"Contador de toques","Cuadrícula de deslizamiento":"Grade de deslizamento","Ventana":"Janela","SDR":"SDR","HDR":"HDR","HDR no disponible en este navegador o pantalla":"HDR não disponível neste navegador ou tela","Toques a la vez":"Toques simultâneos","Cuadros":"Quadrados","cubierto":"coberto","Cada dedo o clic deja un círculo de color que se mantiene al soltar. Al volver a tocar la pantalla, los círculos se borran. El contador muestra cuántos puntos se tocan a la vez y el máximo.":"Cada dedo ou clique deixa um círculo colorido que permanece ao soltar. Ao tocar a tela de novo, os círculos são apagados. O contador mostra quantos pontos são tocados ao mesmo tempo e o máximo.","Desliza el dedo o el ratón por la pantalla: cada cuadro que cruzas se pinta. Sirve para comprobar que todas las zonas detectan el toque. Ajusta la cantidad de cuadros o limpia para empezar de nuevo.":"Deslize o dedo ou o mouse pela tela: cada quadrado que cruzar será pintado. Serve para verificar se todas as áreas detectam o toque. Ajuste a quantidade de quadrados ou limpe para começar de novo.","Negro puro":"Preto puro","Smearing (VA)":"Smearing (VA)","Fondo":"Fundo","Gris oscuro":"Cinza escuro","Gris medio":"Cinza médio","Usar negro puro en modo oscuro":"Usar preto puro no modo escuro","Tamaño de estrellas":"Tamanho das estrelas","Nitidez de texto":"Nitidez do texto","Texto en movimiento":"Texto em movimento","Grises":"Cinzas","Cómo activar HDR":"Como ativar o HDR","Una ventana blanca sobre negro, con tamaño de 10 a 100 % del área de la pantalla. Un área pequeña mide el pico de brillo; un área grande mide el brillo sostenido. Elige SDR o HDR. HDR requiere un navegador y una pantalla compatibles; mira Cómo activar HDR.":"Uma janela branca sobre preto, com tamanho de 10 a 100 % da área da tela. Uma área pequena mede o brilho de pico; uma área grande mede o brilho sustentado. Escolha SDR ou HDR. HDR exige navegador e tela compatíveis; veja Como ativar o HDR.","HDR todavía no es compatible con todos los navegadores: el soporte en CSS depende del navegador, su versión y su motor. Esta prueba no se ha verificado en navegadores reales con HDR.":"Nem todos os navegadores suportam HDR ainda: o suporte em CSS depende do navegador, da versão e do motor. Este teste não foi verificado em navegadores reais com HDR.","Activa HDR en el sistema: en Windows, Configuración › Sistema › Pantalla › Usar HDR (o Win + Alt + B). En macOS, Android y Linux, busca la opción de HDR en los ajustes de pantalla.":"Ative o HDR no sistema: no Windows, Configurações › Sistema › Tela › Usar HDR (ou Win + Alt + B). No macOS, Android e Linux, procure a opção de HDR nas configurações de tela.","Chrome: si la prueba sigue en SDR, abre chrome://flags/#force-color-profile, elige HDR10 o scRGB linear y reinicia el navegador.":"Chrome: se o teste continuar em SDR, abra chrome://flags/#force-color-profile, escolha HDR10 ou scRGB linear e reinicie o navegador.","Edge (basado en Chromium): busca la misma opción de perfil de color en edge://flags.":"Edge (baseado em Chromium): procure a mesma opção de perfil de cor em edge://flags.","Firefox: usa la versión 153 o posterior y comprueba si la prueba cambia; el soporte es reciente.":"Firefox: use a versão 153 ou posterior e verifique se o teste muda; o suporte é recente.","Safari (macOS): usa una pantalla compatible con HDR y comprueba la prueba; no hemos podido verificarlo.":"Safari (macOS): use uma tela compatível com HDR e verifique o teste; não conseguimos confirmar isso.","Si la prueba sigue en SDR aunque lo hayas activado, el navegador no soporta HDR en CSS. Para comparar, abre testufo.com/hdr.":"Se o teste continuar em SDR mesmo com o HDR ativado, o navegador não suporta HDR em CSS. Para comparar, abra testufo.com/hdr.","Calibración":"Calibração","Convergencia":"Convergência","Cuadros cuadrados":"Quadrados","Cuadrícula":"Grade","Tablero de cuadros que deben verse cuadrados. Si salen rectangulares, la imagen está escalada de forma desigual en horizontal y vertical.":"Tabuleiro de quadrados que devem parecer quadrados. Se saírem retangulares, a imagem está escalada de forma desigual na horizontal e na vertical.","Relación de aspecto":"Proporção de tela","Dirección":"Direção","Escala de grises y seis escalas de diez pasos, una por color. Usa la opción Escala para verlas todas o una sola.":"Escala de cinza e seis escalas de dez passos, uma por cor. Use a opção Escala para vê-las todas ou apenas uma.","Escalas de color y grises":"Escalas de cor e cinza","Ghosting y smearing":"Ghosting e smearing","Ghosting: un bloque cruza la pantalla sobre fondos claro y oscuro; si deja estela, la respuesta es lenta (más segundos por pasada, más lento). Smearing (VA): una barra blanca se mueve sobre un fondo oscuro; en paneles VA deja una estela oscura o clara. Usa Pausar para revisar un solo cuadro.":"Ghosting: um bloco atravessa a tela sobre fundos claro e escuro; se deixar rastro, a resposta é lenta (mais segundos por passagem, mais lento). Smearing (VA): uma barra branca se move sobre um fundo escuro; em painéis VA deixa um rastro escuro ou claro. Use Pausar para revisar um único quadro.","Horizontal":"Horizontal","Inicio automático de pruebas de movimiento":"Início automático de testes de movimento","Modo":"Modo","Rango":"Faixa","Uniforme":"Uniforme","Variado":"Variado","Vertical":"Vertical","activado":"ativado","desactivado":"desativado","Relación de aspecto y overscan":"Proporção de tela e overscan","Relación de aspecto: círculo y marcos de 4:3, 16:9, 21:9 y 32:9. Cada marco se ajusta al borde más cercano de la pantalla y lleva su nombre; si la imagen se estira, el círculo deja de ser redondo. Overscan: recuadros a 0, 2, 5 y 10 % de los bordes con una cruz central; si el televisor recorta la imagen, el recuadro de 0 % no se ve completo.":"Proporção de tela: círculo e quadros de 4:3, 16:9, 21:9 e 32:9. Cada quadro se ajusta à borda mais próxima da tela e mostra seu nome; se a imagem for esticada, o círculo deixa de ser redondo. Overscan: caixas a 0, 2, 5 e 10 % das bordas com uma cruz central; se a TV cortar a imagem, a caixa de 0 % não aparece inteira.","Overscan":"Overscan","Rejillas roja, verde y azul superpuestas. Aplica a tubos CRT y a proyectores de tres paneles o chips (3LCD, DLP de 3 chips). En pantallas planas de un solo panel (LCD, OLED, Mini LED) la convergencia viene de fábrica y no se ajusta: la prueba solo muestra desalineación de color. Con buena convergencia las líneas y los puntos se ven blancos; si no converge, aparecen bordes o puntos de color.":"Grades vermelha, verde e azul sobrepostas. Aplica-se a tubos CRT e projetores de três painéis ou chips (3LCD, DLP de 3 chips). Em telas planas de painel único (LCD, OLED, Mini LED) a convergência vem de fábrica e não é ajustável: o teste só mostra desalinhamento de cor. Com boa convergência, linhas e pontos aparecem brancos; se não convergir, surgem bordas ou pontos coloridos.","Doble toque en la pantalla para mostrar u ocultar el panel":"Toque duas vezes na tela para mostrar ou ocultar o painel","Alfabeto":"Alfabeto","Latino":"Latino","Japonés":"Japonês","Coreano":"Coreano","Chino":"Chinês","Ruso":"Russo","Árabe":"Árabe","Texto para revisar la nitidez en pantallas de píxel blanco (como W-OLED). Elige el alfabeto (latino, japonés, coreano, chino, ruso o árabe) y compara los bordes de las letras: si aparecen franjas de color, la pantalla usa otra distribución de subpíxeles o un filtro de nitidez. Las letras pequeñas son la mejor prueba.":"Texto para verificar a nitidez em telas de pixel branco (como W-OLED). Escolha o alfabeto (latino, japonês, coreano, chinês, russo ou árabe) e compare as bordas das letras: se aparecerem franjas coloridas, a tela usa outra disposição de subpixels ou um filtro de nitidez. As letras pequenas são o melhor teste.","Tres franjas de texto que se desplazan en direcciones opuestas. En horizontal: a la izquierda, texto vertical que sube; al centro, filas de texto horizontal que alternan izquierda y derecha; a la derecha, texto vertical que baja. En vertical, el mismo esquema girado. Tamaño uniforme o variado, y alfabeto a elegir. En paneles VA el texto en movimiento se emborrona o deja estela; compara la nitidez en pausa y en movimiento.":"Três faixas de texto que se movem em direções opostas. Na horizontal: à esquerda, texto vertical subindo; no centro, linhas de texto horizontal alternando esquerda e direita; à direita, texto vertical descendo. Na vertical, o mesmo esquema girado. Tamanho uniforme ou variado, com alfabeto à escolha. Em painéis VA o texto em movimento borra ou deixa rastro; compare a nitidez parado e em movimento.","Cuadrícula o calibración. La calibración añade un recuadro central dentro del círculo con barras SMPTE, escala de grises, escala RGB y CMYK, y muestra la resolución, la densidad y la escala de esta pantalla. El navegador no conoce el tamaño físico: indica la diagonal para calcular los ppp. La escala incluye el zoom del navegador; para verla sin zoom, restablécelo al 100 % (Ctrl+0).":"Grade ou calibração. A calibração acrescenta uma caixa central dentro do círculo com barras SMPTE, escala de cinza, escalas RGB e CMYK, e mostra a resolução, a densidade e a escala desta tela. O navegador não conhece o tamanho físico: informe a diagonal para calcular o ppp. A escala inclui o zoom do navegador; para vê-la sem zoom, redefina o zoom para 100 % (Ctrl+0)."},"fr":{"Pruebas de pantalla":"Tests d'écran","Patrones de prueba para revisar color, uniformidad, ghosting y nitidez en móviles, escritorio y televisores.":"Motifs de test pour vérifier couleur, uniformité, rémanence et netteté sur mobiles, ordinateurs et télévisions.","Filtrar por categoría":"Filtrer par catégorie","Las pruebas de movimiento y de cambio de color pueden afectar a personas fotosensibles. Usa velocidades moderadas y detente si sientes molestias.":"Les tests de mouvement et de changement de couleur peuvent affecter les personnes photosensibles. Utilisez des vitesses modérées et arrêtez-vous en cas de gêne.","Prueba a pantalla completa":"Test en plein écran","Cerrar":"Fermer","Prueba anterior":"Test précédent","‹ Anterior":"‹ Précédent","Prueba siguiente":"Test suivant","Siguiente ›":"Suivant ›","Idioma":"Langue","Tema":"Thème","Automático":"Automatique","Claro":"Clair","Oscuro":"Sombre","oscuro":"sombre","claro":"clair","sistema":"système","Todas":"Toutes","Color":"Couleur","Uniformidad":"Uniformité","Píxeles":"Pixels","Movimiento":"Mouvement","Nitidez":"Netteté","Táctil":"Tactile","SMPTE barras":"Barres SMPTE","Escala de grises":"Échelle de gris","Contraste":"Contraste","Uniformidad gris":"Uniformité grise","Uniformidad RGB y CMYK":"Uniformité RVB et CMJN","Desatascador de píxeles":"Débloqueur de pixels","Atenuación local":"Gradation locale","Ghosting":"Rémanence","Geometría":"Géométrie","Geometría y calibración":"Géométrie et calibrage","Negros bajos":"Noirs foncés","Líneas finas":"Lignes fines","Nivel":"Niveau","Velocidad":"Vitesse","Tamaño":"Taille","Densidad":"Densité","Pasada":"Passage","Diagonal":"Diagonale","cada":"toutes les","rápido":"rapide","estrellas":"étoiles","pulg":"po","no indicada":"non indiquée","Limpiar":"Effacer","Negro":"Noir","Gris":"Gris","Blanco":"Blanc","Rojo":"Rouge","Verde":"Vert","Azul":"Bleu","Cian":"Cyan","Magenta":"Magenta","Amarillo":"Jaune","Negro (K)":"Noir (K)","Iniciar":"Démarrer","Pausar":"Pause","ajustable":"réglable","Abrir":"Ouvrir","ppp":"ppp","indica la diagonal para ver ppp":"indiquez la diagonale pour voir les ppp","Resolución":"Résolution","Escala":"Échelle","visor":"visionneuse","ventana":"fenêtre","CSS":"CSS","máximo":"max.","Espacio":"Espace","Atrás":"Retour","cierra":"ferme","controles":"commandes","pausa":"pause","acepta":"valide","cambian de prueba":"changent de test","muestra u oculta el panel":"affiche ou masque le panneau","Clic en la pantalla muestra u oculta el panel":"Cliquez sur l'écran pour afficher ou masquer le panneau","Desliza ← → para cambiar de prueba":"Glissez ← → pour changer de test","Desliza hacia abajo para cerrar":"Glissez vers le bas pour fermer","Guía rápida.":"Guide rapide.","Revisa color, brillo y niveles de negro con barras estándar.":"Vérifie la couleur, la luminosité et les niveaux de noir avec des barres standard.","Bloques de 5 % a 95 %. El nivel elegido se muestra grande sobre negro y sobre blanco; el marco amarillo lo señala.":"Blocs de 5 % à 95 %. Le niveau choisi s'affiche en grand sur noir et sur blanc ; le cadre jaune le signale.","Un solo gris de 0 a 100 %, con atajos para negro y blanco. El negro muestra fuga de luz y nubosidad; el blanco, manchas y viñeteo; los grises medios, bandas.":"Un seul gris de 0 à 100 %, avec raccourcis pour noir et blanc. Le noir montre les fuites de lumière et les nuages ; le blanc, les taches et le vignetage ; les gris moyens, les bandes.","Un color a pantalla completa a la vez: rojo, verde, azul, cian, magenta, amarillo, blanco y negro (K). Cambia a mano, sin parpadeo automático. También sirve para buscar píxeles muertos: busca puntos que no coincidan con el color.":"Une couleur plein écran à la fois : rouge, vert, bleu, cyan, magenta, jaune, blanc et noir (K). Changez à la main, sans clignotement automatique. Sert aussi à trouver les pixels morts : repérez les points qui ne correspondent pas à la couleur.","Cuadrícula de cuadros que cambian de color al azar entre rojo, verde, azul, cian, magenta, amarillo, blanco y negro. Cada cuadro cambia por su cuenta, en un momento distinto y sin seguir una secuencia. Empieza en pausa. No siempre libera un píxel atascado.":"Grille de carrés qui changent de couleur au hasard entre rouge, vert, bleu, cyan, magenta, jaune, blanc et noir. Chaque carré change de son côté, à un moment différent et sans suivre de séquence. Démarre en pause. Ne débloque pas toujours un pixel coincé.","Cambia de color de forma repetida, y más rápido en las velocidades altas. Evítalo si eres fotosensible.":"Change de couleur de façon répétée, plus vite aux vitesses élevées. Évitez-le si vous êtes photosensible.","Estrellas de distintos tamaños que se desplazan despacio sobre negro. Si alrededor de las más brillantes aparece un halo, o si se apagan al cruzar, la pantalla usa atenuación local (local dimming). Cambia la densidad: con pocas estrellas el halo se ve mejor, y con muchas la prueba exige más a la retroiluminación.":"Étoiles de tailles différentes qui dérivent lentement sur noir. Si un halo apparaît autour des plus brillantes, ou si elles s'éteignent en traversant des zones, l'écran utilise la gradation locale (local dimming). Changez la densité : avec peu d'étoiles le halo se voit mieux, avec beaucoup le test sollicite davantage le rétroéclairage.","Barras de 0 a 8 % de luminancia sobre negro. Lo ideal es distinguir las barras de 2 % y 4 % del fondo, y que la de 0 % se funda con él. Si todas se ven iguales, el televisor aplasta las sombras; si la de 0 % se ve gris, el negro está levantado. Haz la prueba en cuarto oscuro.":"Barres de 0 à 8 % de luminance sur noir. L'idéal est de distinguer les barres de 2 % et 4 % du fond, et que celle de 0 % se fonde avec lui. Si elles se ressemblent toutes, la TV écrase les ombres ; si celle de 0 % paraît grise, le noir est relevé. Faites le test dans une pièce sombre.","Líneas blancas y negras de un píxel real: verticales en la mitad superior y horizontales en la inferior. Deberías distinguir cada línea. Si se ven grises, borrosas o con patrones de interferencia (moiré), la pantalla escala la imagen.":"Lignes blanches et noires d'un pixel réel : verticales dans la moitié supérieure et horizontales dans la moitié inférieure. Vous devez distinguer chaque ligne. Si elles paraissent grises, floues ou avec des motifs d'interférence (moiré), l'écran met l'image à l'échelle.","Toca una miniatura para abrirla a pantalla completa. Fija el brillo de tu pantalla antes de empezar. Usa Uniformidad para ver manchas y fuga de luz, y para buscar puntos apagados o fijos con un color a la vez. Usa Píxeles para intentar liberar un píxel atascado, y Atenuación local para detectar halos de la retroiluminación. En Ghosting, observa si el bloque deja estela. En Geometría y calibración, revisa el recuadro central y la resolución, densidad y escala de tu pantalla.":"Touchez une vignette pour l'ouvrir en plein écran. Réglez la luminosité de votre écran avant de commencer. Utilisez Uniformité pour voir les taches et les fuites de lumière, et pour repérer les points éteints ou fixes une couleur à la fois. Utilisez Pixels pour tenter de libérer un pixel coincé, et Gradation locale pour repérer les halos du rétroéclairage. Dans Rémanence, observez si le bloc laisse une traînée. Dans Géométrie et calibrage, vérifiez le cadre central ainsi que la résolution, la densité et l'échelle de votre écran.","Hay movimiento. Puede afectar a personas fotosensibles; usa velocidades moderadas.":"Il y a du mouvement. Peut affecter les personnes photosensibles ; utilisez des vitesses modérées.","Pico de brillo":"Luminosité crête","Contador de toques":"Compteur de touchers","Cuadrícula de deslizamiento":"Grille de glissement","Ventana":"Fenêtre","SDR":"SDR","HDR":"HDR","HDR no disponible en este navegador o pantalla":"HDR non disponible dans ce navigateur ou sur cet écran","Toques a la vez":"Touchers simultanés","Cuadros":"Carrés","cubierto":"couvert","Cada dedo o clic deja un círculo de color que se mantiene al soltar. Al volver a tocar la pantalla, los círculos se borran. El contador muestra cuántos puntos se tocan a la vez y el máximo.":"Chaque doigt ou clic laisse un cercle coloré qui reste après le relâchement. Toucher à nouveau l'écran efface les cercles. Le compteur indique combien de points sont touchés en même temps, et le maximum.","Desliza el dedo o el ratón por la pantalla: cada cuadro que cruzas se pinta. Sirve para comprobar que todas las zonas detectan el toque. Ajusta la cantidad de cuadros o limpia para empezar de nuevo.":"Glissez le doigt ou la souris sur l'écran : chaque carré traversé est peint. Sert à vérifier que toutes les zones détectent le toucher. Ajustez le nombre de carrés ou effacez pour recommencer.","Negro puro":"Noir pur","Smearing (VA)":"Smearing (VA)","Fondo":"Fond","Gris oscuro":"Gris foncé","Gris medio":"Gris moyen","Usar negro puro en modo oscuro":"Utiliser le noir pur en mode sombre","Tamaño de estrellas":"Taille des étoiles","Nitidez de texto":"Netteté du texte","Texto en movimiento":"Texte en mouvement","Grises":"Gris","Cómo activar HDR":"Comment activer le HDR","Una ventana blanca sobre negro, con tamaño de 10 a 100 % del área de la pantalla. Un área pequeña mide el pico de brillo; un área grande mide el brillo sostenido. Elige SDR o HDR. HDR requiere un navegador y una pantalla compatibles; mira Cómo activar HDR.":"Une fenêtre blanche sur fond noir, de 10 à 100 % de la surface de l'écran. Une petite surface mesure la luminosité crête ; une grande surface mesure la luminosité soutenue. Choisissez SDR ou HDR. Le HDR exige un navigateur et un écran compatibles ; voir Comment activer le HDR.","HDR todavía no es compatible con todos los navegadores: el soporte en CSS depende del navegador, su versión y su motor. Esta prueba no se ha verificado en navegadores reales con HDR.":"Tous les navigateurs ne prennent pas encore en charge le HDR : la prise en charge en CSS dépend du navigateur, de sa version et de son moteur. Ce test n'a pas été vérifié sur de vrais navigateurs HDR.","Activa HDR en el sistema: en Windows, Configuración › Sistema › Pantalla › Usar HDR (o Win + Alt + B). En macOS, Android y Linux, busca la opción de HDR en los ajustes de pantalla.":"Activez le HDR dans le système : sous Windows, Paramètres › Système › Affichage › Utiliser le HDR (ou Win + Alt + B). Sous macOS, Android et Linux, cherchez l'option HDR dans les réglages d'affichage.","Chrome: si la prueba sigue en SDR, abre chrome://flags/#force-color-profile, elige HDR10 o scRGB linear y reinicia el navegador.":"Chrome : si le test reste en SDR, ouvrez chrome://flags/#force-color-profile, choisissez HDR10 ou scRGB linear et redémarrez le navigateur.","Edge (basado en Chromium): busca la misma opción de perfil de color en edge://flags.":"Edge (basé sur Chromium) : cherchez la même option de profil colorimétrique dans edge://flags.","Firefox: usa la versión 153 o posterior y comprueba si la prueba cambia; el soporte es reciente.":"Firefox : utilisez la version 153 ou une version ultérieure et vérifiez si le test change ; la prise en charge est récente.","Safari (macOS): usa una pantalla compatible con HDR y comprueba la prueba; no hemos podido verificarlo.":"Safari (macOS) : utilisez un écran compatible HDR et vérifiez le test ; nous n'avons pas pu le confirmer.","Si la prueba sigue en SDR aunque lo hayas activado, el navegador no soporta HDR en CSS. Para comparar, abre testufo.com/hdr.":"Si le test reste en SDR alors que vous avez activé le HDR, le navigateur ne prend pas en charge le HDR en CSS. Pour comparer, ouvrez testufo.com/hdr.","Calibración":"Calibrage","Convergencia":"Convergence","Cuadros cuadrados":"Carrés","Cuadrícula":"Grille","Tablero de cuadros que deben verse cuadrados. Si salen rectangulares, la imagen está escalada de forma desigual en horizontal y vertical.":"Damier de carrés qui doivent paraître carrés. S'ils sortent rectangulaires, l'image est mise à l'échelle de façon inégale à l'horizontale et à la verticale.","Relación de aspecto":"Rapport d'aspect","Dirección":"Direction","Escala de grises y seis escalas de diez pasos, una por color. Usa la opción Escala para verlas todas o una sola.":"Échelle de gris et six échelles de dix paliers, une par couleur. Utilisez l'option Échelle pour toutes les voir ou une seule.","Escalas de color y grises":"Échelles de couleurs et de gris","Ghosting y smearing":"Ghosting et smearing","Ghosting: un bloque cruza la pantalla sobre fondos claro y oscuro; si deja estela, la respuesta es lenta (más segundos por pasada, más lento). Smearing (VA): una barra blanca se mueve sobre un fondo oscuro; en paneles VA deja una estela oscura o clara. Usa Pausar para revisar un solo cuadro.":"Ghosting : un bloc traverse l'écran sur des fonds clair et sombre ; s'il laisse une traînée, la réponse est lente (plus de secondes par passage, plus lent). Smearing (VA) : une barre blanche se déplace sur un fond sombre ; sur les dalles VA elle laisse une traînée sombre ou claire. Utilisez Pause pour revoir une seule image.","Horizontal":"Horizontal","Inicio automático de pruebas de movimiento":"Démarrage automatique des tests de mouvement","Modo":"Mode","Rango":"Plage","Uniforme":"Uniforme","Variado":"Varié","Vertical":"Vertical","activado":"activé","desactivado":"désactivé","Relación de aspecto y overscan":"Format d'image et overscan","Relación de aspecto: círculo y marcos de 4:3, 16:9, 21:9 y 32:9. Cada marco se ajusta al borde más cercano de la pantalla y lleva su nombre; si la imagen se estira, el círculo deja de ser redondo. Overscan: recuadros a 0, 2, 5 y 10 % de los bordes con una cruz central; si el televisor recorta la imagen, el recuadro de 0 % no se ve completo.":"Format d'image : cercle et cadres 4:3, 16:9, 21:9 et 32:9. Chaque cadre s'ajuste au bord le plus proche de l'écran et affiche son nom ; si l'image est étirée, le cercle n'est plus rond. Overscan : cadres à 0, 2, 5 et 10 % des bords avec une croix centrale ; si le téléviseur rogne l'image, le cadre à 0 % n'apparaît pas en entier.","Overscan":"Overscan","Rejillas roja, verde y azul superpuestas. Aplica a tubos CRT y a proyectores de tres paneles o chips (3LCD, DLP de 3 chips). En pantallas planas de un solo panel (LCD, OLED, Mini LED) la convergencia viene de fábrica y no se ajusta: la prueba solo muestra desalineación de color. Con buena convergencia las líneas y los puntos se ven blancos; si no converge, aparecen bordes o puntos de color.":"Grilles rouge, verte et bleue superposées. S'applique aux tubes CRT et aux projecteurs à trois panneaux ou trois puces (3LCD, DLP 3 puces). Sur les écrans plats à panneau unique (LCD, OLED, Mini LED), la convergence est réglée en usine et ne se règle pas : le test montre seulement un désalignement des couleurs. Avec une bonne convergence, lignes et points paraissent blancs ; sinon, des bords ou des points colorés apparaissent.","Doble toque en la pantalla para mostrar u ocultar el panel":"Tapotez deux fois l'écran pour afficher ou masquer le panneau","Alfabeto":"Alphabet","Latino":"Latin","Japonés":"Japonais","Coreano":"Coréen","Chino":"Chinois","Ruso":"Russe","Árabe":"Arabe","Texto para revisar la nitidez en pantallas de píxel blanco (como W-OLED). Elige el alfabeto (latino, japonés, coreano, chino, ruso o árabe) y compara los bordes de las letras: si aparecen franjas de color, la pantalla usa otra distribución de subpíxeles o un filtro de nitidez. Las letras pequeñas son la mejor prueba.":"Texte pour vérifier la netteté sur les écrans à pixels blancs (comme le W-OLED). Choisissez l'alphabet (latin, japonais, coréen, chinois, russe ou arabe) et comparez les bords des lettres : si des franges de couleur apparaissent, l'écran utilise une autre disposition des sous-pixels ou un filtre de netteté. Les petites lettres sont le meilleur test.","Tres franjas de texto que se desplazan en direcciones opuestas. En horizontal: a la izquierda, texto vertical que sube; al centro, filas de texto horizontal que alternan izquierda y derecha; a la derecha, texto vertical que baja. En vertical, el mismo esquema girado. Tamaño uniforme o variado, y alfabeto a elegir. En paneles VA el texto en movimiento se emborrona o deja estela; compara la nitidez en pausa y en movimiento.":"Trois bandes de texte qui défilent en sens opposés. En horizontal : à gauche, du texte vertical qui monte ; au centre, des lignes de texte horizontal alternant gauche et droite ; à droite, du texte vertical qui descend. En vertical, le même schéma pivoté. Taille uniforme ou variée, avec un choix d'alphabet. Sur les dalles VA, le texte en mouvement bave ou laisse une traînée ; comparez la netteté à l'arrêt et en mouvement.","Cuadrícula o calibración. La calibración añade un recuadro central dentro del círculo con barras SMPTE, escala de grises, escala RGB y CMYK, y muestra la resolución, la densidad y la escala de esta pantalla. El navegador no conoce el tamaño físico: indica la diagonal para calcular los ppp. La escala incluye el zoom del navegador; para verla sin zoom, restablécelo al 100 % (Ctrl+0).":"Grille ou calibrage. Le calibrage ajoute un cadre central dans le cercle avec des barres SMPTE, une échelle de gris, des échelles RVB et CMJN, et affiche la résolution, la densité et l'échelle de cet écran. Le navigateur ne connaît pas la taille physique : indiquez la diagonale pour calculer les ppp. L'échelle inclut le zoom du navigateur ; pour la voir sans zoom, rétablissez le zoom à 100 % (Ctrl+0)."},"de":{"Pruebas de pantalla":"Bildschirmtests","Patrones de prueba para revisar color, uniformidad, ghosting y nitidez en móviles, escritorio y televisores.":"Testmuster zum Prüfen von Farbe, Gleichmäßigkeit, Ghosting und Schärfe auf Handys, Computern und Fernsehern.","Filtrar por categoría":"Nach Kategorie filtern","Las pruebas de movimiento y de cambio de color pueden afectar a personas fotosensibles. Usa velocidades moderadas y detente si sientes molestias.":"Bewegungs- und Farbwechseltests können bei Lichtempfindlichkeit Beschwerden verursachen. Verwenden Sie moderate Geschwindigkeiten und hören Sie bei Unbehagen auf.","Prueba a pantalla completa":"Vollbildtest","Cerrar":"Schließen","Prueba anterior":"Vorheriger Test","‹ Anterior":"‹ Zurück","Prueba siguiente":"Nächster Test","Siguiente ›":"Weiter ›","Idioma":"Sprache","Tema":"Thema","Automático":"Automatisch","Claro":"Hell","Oscuro":"Dunkel","oscuro":"dunkel","claro":"hell","sistema":"System","Todas":"Alle","Color":"Farbe","Uniformidad":"Gleichmäßigkeit","Píxeles":"Pixel","Movimiento":"Bewegung","Nitidez":"Schärfe","Táctil":"Touch","SMPTE barras":"SMPTE-Balken","Escala de grises":"Graustufen","Contraste":"Kontrast","Uniformidad gris":"Graue Gleichmäßigkeit","Uniformidad RGB y CMYK":"RGB- und CMYK-Gleichmäßigkeit","Desatascador de píxeles":"Pixel-Entstopper","Atenuación local":"Local Dimming","Ghosting":"Ghosting","Geometría":"Geometrie","Geometría y calibración":"Geometrie und Kalibrierung","Negros bajos":"Tiefe Schwarztöne","Líneas finas":"Feine Linien","Nivel":"Stufe","Velocidad":"Geschwindigkeit","Tamaño":"Größe","Densidad":"Dichte","Pasada":"Durchgang","Diagonal":"Diagonale","cada":"alle","rápido":"schnell","estrellas":"Sterne","pulg":"Zoll","no indicada":"nicht angegeben","Limpiar":"Leeren","Negro":"Schwarz","Gris":"Grau","Blanco":"Weiß","Rojo":"Rot","Verde":"Grün","Azul":"Blau","Cian":"Cyan","Magenta":"Magenta","Amarillo":"Gelb","Negro (K)":"Schwarz (K)","Iniciar":"Starten","Pausar":"Pausieren","ajustable":"einstellbar","Abrir":"Öffnen","ppp":"ppi","indica la diagonal para ver ppp":"Diagonale angeben für ppi","Resolución":"Auflösung","Escala":"Skalierung","visor":"Ansicht","ventana":"Fenster","CSS":"CSS","máximo":"max.","Espacio":"Leertaste","Atrás":"Zurück","cierra":"schließt","controles":"Steuerung","pausa":"Pause","acepta":"bestätigt","cambian de prueba":"wechseln den Test","muestra u oculta el panel":"ein- oder ausblenden","Clic en la pantalla muestra u oculta el panel":"Klicken zum Ein- oder Ausblenden des Bedienfelds","Desliza ← → para cambiar de prueba":"Wischen ← → für anderen Test","Desliza hacia abajo para cerrar":"Nach unten wischen zum Schließen","Guía rápida.":"Kurzanleitung.","Revisa color, brillo y niveles de negro con barras estándar.":"Prüft Farbe, Helligkeit und Schwarzwerte mit Standardbalken.","Bloques de 5 % a 95 %. El nivel elegido se muestra grande sobre negro y sobre blanco; el marco amarillo lo señala.":"Blöcke von 5 % bis 95 %. Die gewählte Stufe wird groß auf Schwarz und auf Weiß gezeigt; der gelbe Rahmen markiert sie.","Un solo gris de 0 a 100 %, con atajos para negro y blanco. El negro muestra fuga de luz y nubosidad; el blanco, manchas y viñeteo; los grises medios, bandas.":"Ein einzelnes Grau von 0 bis 100 %, mit Kurzwahl für Schwarz und Weiß. Schwarz zeigt Lichtlecks und Wolken; Weiß zeigt Flecken und Vignettierung; mittlere Grautöne zeigen Banding.","Un color a pantalla completa a la vez: rojo, verde, azul, cian, magenta, amarillo, blanco y negro (K). Cambia a mano, sin parpadeo automático. También sirve para buscar píxeles muertos: busca puntos que no coincidan con el color.":"Immer eine Vollbildfarbe: Rot, Grün, Blau, Cyan, Magenta, Gelb, Weiß und Schwarz (K). Manuell wechseln, ohne automatisches Flackern. Auch geeignet, um tote Pixel zu finden: Stellen suchen, die nicht zur Farbe passen.","Cuadrícula de cuadros que cambian de color al azar entre rojo, verde, azul, cian, magenta, amarillo, blanco y negro. Cada cuadro cambia por su cuenta, en un momento distinto y sin seguir una secuencia. Empieza en pausa. No siempre libera un píxel atascado.":"Raster aus Quadraten, die zufällig zwischen Rot, Grün, Blau, Cyan, Magenta, Gelb, Weiß und Schwarz wechseln. Jedes Quadrat wechselt für sich, zu einem anderen Zeitpunkt und ohne Reihenfolge. Startet pausiert. Hängt ein Pixel fest, wird er nicht immer gelöst.","Cambia de color de forma repetida, y más rápido en las velocidades altas. Evítalo si eres fotosensible.":"Wechselt wiederholt die Farbe, bei hohen Geschwindigkeiten schneller. Vermeiden Sie ihn bei Lichtempfindlichkeit.","Estrellas de distintos tamaños que se desplazan despacio sobre negro. Si alrededor de las más brillantes aparece un halo, o si se apagan al cruzar, la pantalla usa atenuación local (local dimming). Cambia la densidad: con pocas estrellas el halo se ve mejor, y con muchas la prueba exige más a la retroiluminación.":"Sterne unterschiedlicher Größe, die langsam über Schwarz wandern. Erscheint um die hellsten ein Halo oder verblassen sie beim Durchqueren, nutzt der Bildschirm Local Dimming. Die Dichte ändern: Bei wenigen Sternen ist das Halo besser sichtbar, bei vielen fordert der Test die Hintergrundbeleuchtung stärker.","Barras de 0 a 8 % de luminancia sobre negro. Lo ideal es distinguir las barras de 2 % y 4 % del fondo, y que la de 0 % se funda con él. Si todas se ven iguales, el televisor aplasta las sombras; si la de 0 % se ve gris, el negro está levantado. Haz la prueba en cuarto oscuro.":"Balken von 0 bis 8 % Leuchtdichte auf Schwarz. Ideal ist, dass man die Balken mit 2 % und 4 % vom Hintergrund unterscheidet und der 0-%-Balken darin verschwindet. Wenn alle gleich aussehen, werden Schatten abgeschnitten; wenn der 0-%-Balken grau wirkt, ist Schwarz angehoben. Test in einem dunklen Raum durchführen.","Líneas blancas y negras de un píxel real: verticales en la mitad superior y horizontales en la inferior. Deberías distinguir cada línea. Si se ven grises, borrosas o con patrones de interferencia (moiré), la pantalla escala la imagen.":"Weiße und schwarze Linien mit einem echten Pixel Breite: senkrecht in der oberen, waagerecht in der unteren Hälfte. Jede Linie sollte unterscheidbar sein. Wirken sie grau, unscharf oder zeigen Interferenzmuster (Moiré), skaliert der Bildschirm das Bild.","Toca una miniatura para abrirla a pantalla completa. Fija el brillo de tu pantalla antes de empezar. Usa Uniformidad para ver manchas y fuga de luz, y para buscar puntos apagados o fijos con un color a la vez. Usa Píxeles para intentar liberar un píxel atascado, y Atenuación local para detectar halos de la retroiluminación. En Ghosting, observa si el bloque deja estela. En Geometría y calibración, revisa el recuadro central y la resolución, densidad y escala de tu pantalla.":"Tippen Sie auf eine Miniatur, um sie im Vollbild zu öffnen. Stellen Sie die Helligkeit Ihres Bildschirms vor dem Start ein. Nutzen Sie Gleichmäßigkeit, um Flecken und Lichtlecks zu sehen und dunkle oder hängende Punkte jeweils in einer Farbe zu finden. Mit dem Pixel-Entstopper versuchen Sie, einen hängenden Pixel zu lösen, und mit Local Dimming erkennen Sie Halos der Hintergrundbeleuchtung. Bei Ghosting prüfen Sie, ob der Block eine Spur hinterlässt. Bei Geometrie und Kalibrierung prüfen Sie das zentrale Feld sowie Auflösung, Dichte und Skalierung Ihres Bildschirms.","Hay movimiento. Puede afectar a personas fotosensibles; usa velocidades moderadas.":"Enthält Bewegung. Kann bei Lichtempfindlichkeit Beschwerden verursachen; verwenden Sie moderate Geschwindigkeiten.","Pico de brillo":"Spitzenhelligkeit","Contador de toques":"Berührungszähler","Cuadrícula de deslizamiento":"Wischraster","Ventana":"Fenster","SDR":"SDR","HDR":"HDR","HDR no disponible en este navegador o pantalla":"HDR in diesem Browser oder auf diesem Bildschirm nicht verfügbar","Toques a la vez":"Gleichzeitige Berührungen","Cuadros":"Felder","cubierto":"abgedeckt","Cada dedo o clic deja un círculo de color que se mantiene al soltar. Al volver a tocar la pantalla, los círculos se borran. El contador muestra cuántos puntos se tocan a la vez y el máximo.":"Jeder Finger oder Klick hinterlässt einen farbigen Kreis, der nach dem Loslassen bleibt. Erneutes Berühren des Bildschirms löscht die Kreise. Der Zähler zeigt, wie viele Punkte gleichzeitig berührt werden, und das Maximum.","Desliza el dedo o el ratón por la pantalla: cada cuadro que cruzas se pinta. Sirve para comprobar que todas las zonas detectan el toque. Ajusta la cantidad de cuadros o limpia para empezar de nuevo.":"Wischen Sie mit dem Finger oder der Maus über den Bildschirm: Jedes Feld, das Sie überqueren, wird gefärbt. So prüfen Sie, ob alle Bereiche Berührungen erkennen. Passen Sie die Anzahl der Felder an oder leeren Sie, um neu zu beginnen.","Negro puro":"Reines Schwarz","Smearing (VA)":"Smearing (VA)","Fondo":"Hintergrund","Gris oscuro":"Dunkelgrau","Gris medio":"Mittelgrau","Usar negro puro en modo oscuro":"Reines Schwarz im dunklen Modus verwenden","Tamaño de estrellas":"Sternengröße","Nitidez de texto":"Textschärfe","Texto en movimiento":"Bewegter Text","Grises":"Graustufen","Cómo activar HDR":"So aktivierst du HDR","Una ventana blanca sobre negro, con tamaño de 10 a 100 % del área de la pantalla. Un área pequeña mide el pico de brillo; un área grande mide el brillo sostenido. Elige SDR o HDR. HDR requiere un navegador y una pantalla compatibles; mira Cómo activar HDR.":"Ein weißes Fenster auf Schwarz, 10 bis 100 % der Bildschirmfläche groß. Eine kleine Fläche misst die Spitzenhelligkeit, eine große die Dauerhelligkeit. Wähle SDR oder HDR. HDR erfordert einen kompatiblen Browser und Bildschirm; siehe So aktivierst du HDR.","HDR todavía no es compatible con todos los navegadores: el soporte en CSS depende del navegador, su versión y su motor. Esta prueba no se ha verificado en navegadores reales con HDR.":"Noch nicht alle Browser unterstützen HDR: Die CSS-Unterstützung hängt von Browser, Version und Engine ab. Dieser Test wurde nicht in echten HDR-Browsern überprüft.","Activa HDR en el sistema: en Windows, Configuración › Sistema › Pantalla › Usar HDR (o Win + Alt + B). En macOS, Android y Linux, busca la opción de HDR en los ajustes de pantalla.":"Aktiviere HDR im System: unter Windows Einstellungen › System › Anzeige › HDR verwenden (oder Win + Alt + B). Unter macOS, Android und Linux findest du die HDR-Option in den Anzeigeeinstellungen.","Chrome: si la prueba sigue en SDR, abre chrome://flags/#force-color-profile, elige HDR10 o scRGB linear y reinicia el navegador.":"Chrome: Zeigt der Test weiterhin SDR, öffne chrome://flags/#force-color-profile, wähle HDR10 oder scRGB linear und starte den Browser neu.","Edge (basado en Chromium): busca la misma opción de perfil de color en edge://flags.":"Edge (Chromium-basiert): Suche in edge://flags nach derselben Farbprofil-Option.","Firefox: usa la versión 153 o posterior y comprueba si la prueba cambia; el soporte es reciente.":"Firefox: Verwende Version 153 oder neuer und prüfe, ob sich der Test ändert; die Unterstützung ist neu.","Safari (macOS): usa una pantalla compatible con HDR y comprueba la prueba; no hemos podido verificarlo.":"Safari (macOS): Verwende einen HDR-fähigen Bildschirm und prüfe den Test; wir konnten das nicht bestätigen.","Si la prueba sigue en SDR aunque lo hayas activado, el navegador no soporta HDR en CSS. Para comparar, abre testufo.com/hdr.":"Bleibt der Test trotz aktiviertem HDR bei SDR, unterstützt der Browser HDR in CSS nicht. Zum Vergleich öffne testufo.com/hdr.","Calibración":"Kalibrierung","Convergencia":"Konvergenz","Cuadros cuadrados":"Quadratische Felder","Cuadrícula":"Raster","Tablero de cuadros que deben verse cuadrados. Si salen rectangulares, la imagen está escalada de forma desigual en horizontal y vertical.":"Schachbrett aus Quadraten, die quadratisch wirken sollen. Erscheinen sie rechteckig, ist das Bild horizontal und vertikal ungleich skaliert.","Relación de aspecto":"Seitenverhältnis","Dirección":"Richtung","Escala de grises y seis escalas de diez pasos, una por color. Usa la opción Escala para verlas todas o una sola.":"Graustufen und sechs Skalen mit zehn Stufen, je eine pro Farbe. Mit der Option Skalierung siehst du alle oder nur eine.","Escalas de color y grises":"Farb- und Graustufenskalen","Ghosting y smearing":"Ghosting und Smearing","Ghosting: un bloque cruza la pantalla sobre fondos claro y oscuro; si deja estela, la respuesta es lenta (más segundos por pasada, más lento). Smearing (VA): una barra blanca se mueve sobre un fondo oscuro; en paneles VA deja una estela oscura o clara. Usa Pausar para revisar un solo cuadro.":"Ghosting: ein Block überquert den Bildschirm über hellem und dunklem Hintergrund; hinterlässt er Schlieren, reagiert das Panel langsam (mehr Sekunden pro Durchgang, langsamer). Smearing (VA): ein weißer Balken wandert über dunklen Hintergrund; bei VA-Panels bleibt eine dunkle oder helle Spur. Mit Pause prüfst du ein einzelnes Bild.","Horizontal":"Horizontal","Inicio automático de pruebas de movimiento":"Automatischer Start der Bewegungstests","Modo":"Modus","Rango":"Bereich","Uniforme":"Gleichmäßig","Variado":"Gemischt","Vertical":"Vertikal","activado":"aktiviert","desactivado":"deaktiviert","Relación de aspecto y overscan":"Seitenverhältnis und Overscan","Relación de aspecto: círculo y marcos de 4:3, 16:9, 21:9 y 32:9. Cada marco se ajusta al borde más cercano de la pantalla y lleva su nombre; si la imagen se estira, el círculo deja de ser redondo. Overscan: recuadros a 0, 2, 5 y 10 % de los bordes con una cruz central; si el televisor recorta la imagen, el recuadro de 0 % no se ve completo.":"Seitenverhältnis: Kreis und Rahmen für 4:3, 16:9, 21:9 und 32:9. Jeder Rahmen passt an den nächstgelegenen Bildschirmrand und zeigt seinen Namen; wird das Bild gestreckt, ist der Kreis nicht mehr rund. Overscan: Rahmen bei 0, 2, 5 und 10 % der Ränder mit einem Mittelkreuz; beschneidet der Fernseher das Bild, ist der 0-%-Rahmen nicht vollständig sichtbar.","Overscan":"Overscan","Rejillas roja, verde y azul superpuestas. Aplica a tubos CRT y a proyectores de tres paneles o chips (3LCD, DLP de 3 chips). En pantallas planas de un solo panel (LCD, OLED, Mini LED) la convergencia viene de fábrica y no se ajusta: la prueba solo muestra desalineación de color. Con buena convergencia las líneas y los puntos se ven blancos; si no converge, aparecen bordes o puntos de color.":"Rote, grüne und blaue Raster übereinandergelegt. Gilt für Röhrenbildschirme (CRT) und Projektoren mit drei Panels oder Chips (3LCD, 3-Chip-DLP). Bei flachen Einzelpanel-Displays (LCD, OLED, Mini-LED) ist die Konvergenz werkseitig eingestellt und nicht veränderbar; der Test zeigt nur Farbversatz. Bei guter Konvergenz wirken Linien und Punkte weiß; sonst erscheinen farbige Kanten oder Punkte.","Doble toque en la pantalla para mostrar u ocultar el panel":"Zweimal auf den Bildschirm tippen, um das Panel ein- oder auszublenden","Alfabeto":"Alphabet","Latino":"Lateinisch","Japonés":"Japanisch","Coreano":"Koreanisch","Chino":"Chinesisch","Ruso":"Russisch","Árabe":"Arabisch","Texto para revisar la nitidez en pantallas de píxel blanco (como W-OLED). Elige el alfabeto (latino, japonés, coreano, chino, ruso o árabe) y compara los bordes de las letras: si aparecen franjas de color, la pantalla usa otra distribución de subpíxeles o un filtro de nitidez. Las letras pequeñas son la mejor prueba.":"Text zur Prüfung der Schärfe bei Bildschirmen mit weißen Pixeln (wie W-OLED). Wähle das Alphabet (lateinisch, japanisch, koreanisch, chinesisch, russisch oder arabisch) und vergleiche die Buchstabenkanten: Farbsäume deuten auf ein anderes Subpixel-Layout oder einen Schärfefilter hin. Kleine Buchstaben sind der beste Test.","Tres franjas de texto que se desplazan en direcciones opuestas. En horizontal: a la izquierda, texto vertical que sube; al centro, filas de texto horizontal que alternan izquierda y derecha; a la derecha, texto vertical que baja. En vertical, el mismo esquema girado. Tamaño uniforme o variado, y alfabeto a elegir. En paneles VA el texto en movimiento se emborrona o deja estela; compara la nitidez en pausa y en movimiento.":"Drei Textbänder, die in entgegengesetzte Richtungen laufen. Horizontal: links vertikaler Text nach oben, in der Mitte waagerechte Zeilen, die abwechselnd nach links und rechts laufen, rechts vertikaler Text nach unten. Vertikal: dasselbe Schema gedreht. Einheitliche oder gemischte Größe, mit wählbarem Alphabet. Auf VA-Panels verschmiert bewegter Text oder zieht eine Spur; vergleiche die Schärfe im Stand und in Bewegung.","Cuadrícula o calibración. La calibración añade un recuadro central dentro del círculo con barras SMPTE, escala de grises, escala RGB y CMYK, y muestra la resolución, la densidad y la escala de esta pantalla. El navegador no conoce el tamaño físico: indica la diagonal para calcular los ppp. La escala incluye el zoom del navegador; para verla sin zoom, restablécelo al 100 % (Ctrl+0).":"Raster oder Kalibrierung. Die Kalibrierung ergänzt einen zentralen Kasten im Kreis mit SMPTE-Balken, Graustufen, RGB- und CMYK-Skalen und zeigt Auflösung, Dichte und Maßstab dieses Bildschirms. Der Browser kennt die physische Größe nicht: Gib die Diagonale an, um die ppi zu berechnen. Der Maßstab berücksichtigt den Browser-Zoom; ohne Zoom siehst du ihn, wenn du den Zoom auf 100 % zurücksetzt (Strg+0)."}};
var GUIDE="Toca una miniatura para abrirla a pantalla completa. Fija el brillo de tu pantalla antes de empezar. Usa Uniformidad para ver manchas y fuga de luz, y para buscar puntos apagados o fijos con un color a la vez. Usa Píxeles para intentar liberar un píxel atascado, y Atenuación local para detectar halos de la retroiluminación. En Ghosting, observa si el bloque deja estela. En Geometría y calibración, revisa el recuadro central y la resolución, densidad y escala de tu pantalla.";
var MDESC="Patrones de prueba para revisar color, uniformidad, ghosting y nitidez en móviles, escritorio y televisores.";
var LKEY="dt-lang",LMODE="auto",LANG="en";
function sysLang(){
  var l=[],i,c;
  try{if(navigator.languages&&navigator.languages.length)l=Array.prototype.slice.call(navigator.languages);else if(navigator.language)l=[navigator.language]}catch(e){}
  for(i=0;i<l.length;i++){c=String(l[i]).toLowerCase().split("-")[0];if(SUP.indexOf(c)>=0)return c}
  return null}
function resolveLang(){var s=sysLang();LANG=LMODE!=="auto"?LMODE:(s||"en")}
try{var sv=localStorage.getItem(LKEY);if(sv==="auto"||SUP.indexOf(sv)>=0)LMODE=sv}catch(e){}
resolveLang();
function tr(s){var d=DICT[LANG];return d&&d[s]!==undefined?d[s]:s}
var CATS=["Todas","Color","Uniformidad","Píxeles","Movimiento","Nitidez","Táctil"];
var cur="Todas";

function byId(id){return TOOLS.filter(function(t){return t.id===id})[0]}
function thumbOf(t){if(!t.p0)t.p0=JSON.parse(JSON.stringify(t.p||{}));return t.thumb?t.thumb(t.p0):t.draw(t.p0,160,90,false)}

var grid=document.getElementById("grid"),filters=document.getElementById("filters");
function setFilter(c){
  cur=c;
  Array.prototype.forEach.call(filters.children,function(b){b.setAttribute("aria-pressed",b.getAttribute("data-cat")===c?"true":"false")});
  renderGrid();
}
CATS.forEach(function(c){
  var b=document.createElement("button");b.className="btn";b.textContent=tr(c);b.setAttribute("data-cat",c);b.setAttribute("aria-pressed",c===cur?"true":"false");

ab.onclick=function(){AUTO=!AUTO;try{localStorage.setItem("dt-auto",AUTO?"1":"0")}catch(e){}applyAuto()};

/* ---------- tema automático ---------- */
var KEY="dt-theme",root=document.documentElement,mq=null;
var tb=document.getElementById("themeBtn"),tm=document.getElementById("themeMenu"),themeIcon=document.getElementById("themeIcon");
var NAMES={auto:"Automático",light:"Claro",dark:"Oscuro",black:"Negro puro"};
var ICONS={
 auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
 light:'<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>',
 dark:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',black:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>'};
function menuOpen(o){tm.hidden=!o;tb.setAttribute("aria-expanded",o?"true":"false");if(o){var c=tm.querySelector('[aria-checked="true"]')||tm.firstElementChild;c.focus()}}
tb.onclick=function(){langMenuOpen(false);menuOpen(tm.hidden)};
document.addEventListener("click",function(e){if(!tm.hidden&&!tm.contains(e.target)&&!tb.contains(e.target))menuOpen(false);if(!lm.hidden&&!lm.contains(e.target)&&!lb.contains(e.target))langMenuOpen(false)});
tm.addEventListener("keydown",function(e){
  var it=Array.prototype.slice.call(tm.querySelectorAll("button")),i=it.indexOf(document.activeElement);
  if(e.key==="ArrowDown"){it[(i+1)%it.length].focus();e.preventDefault()}
  else if(e.key==="ArrowUp"){it[(i-1+it.length)%it.length].focus();e.preventDefault()}
  else if(e.key==="Escape"){menuOpen(false);tb.focus();e.preventDefault()}
  else if(e.key==="Tab"){menuOpen(false)}
});
try{mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;if(mq&&mq.media==="not all")mq=null}catch(e){mq=null}
var mode="auto";
try{var s=localStorage.getItem(KEY);if(s==="light"||s==="dark"||s==="black"||s==="auto")mode=s}catch(e){}
var OLED=false;try{OLED=localStorage.getItem("dt-oled")==="1"}catch(e){}
var oc=document.getElementById("oledChk");
function effTheme(){var e=mode==="auto"?(mq&&mq.matches?"dark":"light"):mode;if(e==="dark"&&OLED)e="black";return e}
function applyTheme(){
  var eff=effTheme();
  root.setAttribute("data-theme",eff);
  Array.prototype.forEach.call(document.querySelectorAll("[data-theme-opt]"),function(b){b.setAttribute("aria-checked",b.getAttribute("data-theme-opt")===mode?"true":"false")});
  oc.setAttribute("aria-checked",OLED?"true":"false");
  var lab=tr("Tema")+": "+tr(NAMES[mode])+(mode==="auto"?" ("+tr(eff==="light"?"claro":eff==="black"?"Negro puro":"oscuro")+")":"");
  themeIcon.innerHTML=ICONS[mode];tb.setAttribute("aria-label",lab);tb.title=lab;
}
oc.onclick=function(){OLED=!OLED;try{localStorage.setItem("dt-oled",OLED?"1":"0")}catch(e){}applyTheme();oc.focus()};
Array.prototype.forEach.call(document.querySelectorAll("[data-theme-opt]"),function(b){
  b.onclick=function(){mode=b.getAttribute("data-theme-opt");try{localStorage.setItem(KEY,mode)}catch(e){}applyTheme();menuOpen(false);tb.focus()};
});
if(mq){try{mq.addEventListener("change",applyTheme)}catch(e){try{mq.addListener(applyTheme)}catch(e2){}}}

/* ---------- idioma: menú y aplicación ---------- */
var lb=document.getElementById("langBtn"),lm=document.getElementById("langMenu");
function openMenu(){return !tm.hidden?tm:(!lm.hidden?lm:null)}
function closeMenus(){menuOpen(false);langMenuOpen(false)}
function langMenuOpen(o){lm.hidden=!o;lb.setAttribute("aria-expanded",o?"true":"false");if(o){var c=lm.querySelector('[aria-checked="true"]')||lm.firstElementChild;if(c)c.focus()}}
function buildLangMenu(){
  var sys=sysLang(),order=["en"],cur=LMODE==="auto"?(sys||"en"):LMODE;
  if(sys&&sys!=="en")order.push(sys);
  SUP.forEach(function(c){if(order.indexOf(c)<0)order.push(c)});
  lm.innerHTML="";
  order.forEach(function(c){
    var isSys=c===sys,b=document.createElement("button");
    b.setAttribute("role","menuitemradio");b.setAttribute("aria-checked",c===cur?"true":"false");b.setAttribute("lang",c);
    b.textContent=NATIVE[c]+(isSys?" ("+tr("sistema")+")":"");
    b.onclick=function(){LMODE=isSys?"auto":c;try{localStorage.setItem(LKEY,LMODE)}catch(e){}applyLang();langMenuOpen(false);lb.focus()};
    lm.appendChild(b);
  });
}
function showGuide(){gb.innerHTML="<strong>"+tr("Guía rápida.")+"</strong> "+tr(GUIDE)}
function applyLang(){
  resolveLang();
  document.documentElement.lang=LANG;
  document.title=tr("Pruebas de pantalla");
  var md=document.querySelector('meta[name="description"]');if(md)md.content=tr(MDESC);
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"),function(el){el.textContent=tr(el.getAttribute("data-i18n"))});
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"),function(el){el.setAttribute("aria-label",tr(el.getAttribute("data-i18n-aria")))});
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-title]"),function(el){el.title=tr(el.getAttribute("data-i18n-title"))});
  Array.prototype.forEach.call(filters.children,function(b){b.textContent=tr(b.getAttribute("data-cat"))});
  renderGrid();buildLangMenu();
  showGuide();
  applyAuto();
  applyTheme();
}
lb.onclick=function(){menuOpen(false);langMenuOpen(lm.hidden)};
lm.addEventListener("keydown",function(e){
  var it=Array.prototype.slice.call(lm.querySelectorAll("button")),i=it.indexOf(document.activeElement);
  if(e.key==="ArrowDown"){it[(i+1)%it.length].focus();e.preventDefault()}
  else if(e.key==="ArrowUp"){it[(i-1+it.length)%it.length].focus();e.preventDefault()}
  else if(e.key==="Escape"){langMenuOpen(false);lb.focus();e.preventDefault()}
  else if(e.key==="Tab"){langMenuOpen(false)}
});
/* ---------- favicon según el tema del sistema ---------- */
var FAV=null,fmq=null;
try{fmq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;if(fmq&&fmq.media==="not all")fmq=null}catch(e){fmq=null}
function favUri(c){return "data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='"+c+"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='3' width='20' height='14' rx='2' ry='2'/><line x1='8' y1='21' x2='16' y2='21'/><line x1='12' y1='17' x2='12' y2='21'/></svg>")}
function setFav(){
  var dark=false;try{dark=!!(fmq&&fmq.matches)}catch(e){}
  var nl=document.createElement("link");nl.rel="icon";nl.type="image/svg+xml";nl.href=favUri(dark?"#fff":"#000");
  if(FAV&&FAV.parentNode)FAV.parentNode.replaceChild(nl,FAV);else document.head.appendChild(nl);
  FAV=nl;
}
setFav();
if(fmq){try{fmq.addEventListener("change",setFav)}catch(e){try{fmq.addListener(setFav)}catch(e2){}}}
function webApp(){
 var ICON='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#1a1a19"/><g fill="none" stroke="#f1efe8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="1.8"/><line x1="8.5" y1="20" x2="15.5" y2="20"/><line x1="12" y1="16.5" x2="12" y2="20"/></g></svg>',
 src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(ICON);
 function png(n,cb){var im=new Image();im.onload=function(){try{var c=document.createElement("canvas");c.width=c.height=n;c.getContext("2d").drawImage(im,0,0,n,n);cb(c.toDataURL("image/png"))}catch(e){}};im.src=src}
 png(512,function(big){png(192,function(small){
  var name=tr("Pruebas de pantalla"),m={name:name,short_name:name,lang:LANG,start_url:location.href.split(/[?#]/)[0],scope:new URL("./",location.href).href,display:"standalone",background_color:"#1a1a19",theme_color:"#1a1a19",icons:[{src:small,sizes:"192x192",type:"image/png"},{src:big,sizes:"512x512",type:"image/png"}]};
  var l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l);
  var a=document.createElement("link");a.rel="apple-touch-icon";a.href=small;document.head.appendChild(a)})})
}
applyLang();
webApp();
var SPL=document.getElementById("splash");if(SPL){setTimeout(function(){SPL.classList.add("done");setTimeout(function(){SPL.parentNode&&SPL.parentNode.removeChild(SPL)},450)},300)}
})();
</script>
